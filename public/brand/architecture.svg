<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura Allviewser</title>
  <desc id="desc">Núcleo local-first conectado a conversación, proyectos, memoria, taller, archivos y comercio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071816"/>
      <stop offset="55%" stop-color="#0c2a26"/>
      <stop offset="100%" stop-color="#102a28"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb3a3"/>
      <stop offset="100%" stop-color="#1f6f66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163d38"/>
      <stop offset="100%" stop-color="#102f2b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { fill: #e7f1ef; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 700; }
      .sub { fill: #9db8b2; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
      .tiny { fill: #c5d9d4; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .float-a { animation: float 5s ease-in-out infinite; }
      .float-b { animation: float 5.8s ease-in-out infinite reverse; }
      .float-c { animation: float 4.6s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="90" fill="#1f6f66" opacity="0.12" class="pulse"/>
  <circle cx="980" cy="560" r="120" fill="#b86b2c" opacity="0.08" class="pulse"/>

  <!-- connectors -->
  <g stroke="#2bb3a3" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M600 340 L250 160"/>
    <path d="M600 340 L600 120"/>
    <path d="M600 340 L950 160"/>
    <path d="M600 340 L250 520"/>
    <path d="M600 340 L600 560"/>
    <path d="M600 340 L950 520"/>
  </g>

  <!-- core -->
  <g filter="url(#glow)">
    <polygon points="600,250 690,300 690,400 600,450 510,400 510,300" fill="url(#core)"/>
    <polygon points="600,270 670,310 670,390 600,430 530,390 530,310" fill="#0d3d38" opacity="0.35"/>
  </g>
  <text x="600" y="335" text-anchor="middle" class="label" font-size="22">Allviewser</text>
  <text x="600" y="360" text-anchor="middle" class="sub">núcleo local-first</text>

  <!-- modules -->
  <g class="float-a">
    <rect x="90" y="110" width="220" height="86" rx="16" fill="url(#card)" stroke="#2bb3a3" stroke-opacity="0.4"/>
    <text x="200" y="148" text-anchor="middle" class="tiny">Conversación</text>
    <text x="200" y="172" text-anchor="middle" class="sub">modelos configurables</text>
  </g>
  <g class="float-b">
    <rect x="490" y="70" width="220" height="86" rx="16" fill="url(#card)" stroke="#2bb3a3" stroke-opacity="0.4"/>
    <text x="600" y="108" text-anchor="middle" class="tiny">Proyectos</text>
    <text x="600" y="132" text-anchor="middle" class="sub">contexto e idempotencia</text>
  </g>
  <g class="float-c">
    <rect x="890" y="110" width="220" height="86" rx="16" fill="url(#card)" stroke="#2bb3a3" stroke-opacity="0.4"/>
    <text x="1000" y="148" text-anchor="middle" class="tiny">Memoria</text>
    <text x="1000" y="172" text-anchor="middle" class="sub">hechos aprobados</text>
  </g>
  <g class="float-b">
    <rect x="90" y="470" width="220" height="86" rx="16" fill="url(#card)" stroke="#d9c4a3" stroke-opacity="0.35"/>
    <text x="200" y="508" text-anchor="middle" class="tiny">Taller</text>
    <text x="200" y="532" text-anchor="middle" class="sub">apps con pruebas</text>
  </g>
  <g class="float-a">
    <rect x="490" y="510" width="220" height="86" rx="16" fill="url(#card)" stroke="#d9c4a3" stroke-opacity="0.35"/>
    <text x="600" y="548" text-anchor="middle" class="tiny">Archivos</text>
    <text x="600" y="572" text-anchor="middle" class="sub">sandbox por proyecto</text>
  </g>
  <g class="float-c">
    <rect x="890" y="470" width="220" height="86" rx="16" fill="url(#card)" stroke="#d9c4a3" stroke-opacity="0.35"/>
    <text x="1000" y="508" text-anchor="middle" class="tiny">Comercio</text>
    <text x="1000" y="532" text-anchor="middle" class="sub">demo inmersiva</text>
  </g>

  <!-- use cases -->
  <g>
    <rect x="180" y="620" width="140" height="34" rx="17" fill="#143834" stroke="#2bb3a3" stroke-opacity="0.3"/>
    <text x="250" y="642" text-anchor="middle" class="sub" font-size="12" fill="#e7f1ef">Trabajo local</text>
    <rect x="340" y="620" width="140" height="34" rx="17" fill="#143834" stroke="#2bb3a3" stroke-opacity="0.3"/>
    <text x="410" y="642" text-anchor="middle" class="sub" font-size="12" fill="#e7f1ef">Backup</text>
    <rect x="500" y="620" width="160" height="34" rx="17" fill="#143834" stroke="#2bb3a3" stroke-opacity="0.3"/>
    <text x="580" y="642" text-anchor="middle" class="sub" font-size="12" fill="#e7f1ef">Sandbox seguro</text>
    <rect x="680" y="620" width="160" height="34" rx="17" fill="#143834" stroke="#2bb3a3" stroke-opacity="0.3"/>
    <text x="760" y="642" text-anchor="middle" class="sub" font-size="12" fill="#e7f1ef">Doctor / CI</text>
    <rect x="860" y="620" width="160" height="34" rx="17" fill="#143834" stroke="#2bb3a3" stroke-opacity="0.3"/>
    <text x="940" y="642" text-anchor="middle" class="sub" font-size="12" fill="#e7f1ef">Evolutivo</text>
  </g>
</svg>
