name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - run: npm test
      - run: npm run backup:demo
      - run: npm run lint
      - run: npm run build
