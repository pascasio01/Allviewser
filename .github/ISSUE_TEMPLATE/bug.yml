name: Informe de error
description: Describe un problema reproducible
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: No incluyas secretos ni datos personales de terceros.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
  - type: input
    id: version
    attributes:
      label: Versión / commit
